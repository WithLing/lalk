[package]
name = "lalk-desktop"
version = "0.1.0"
description = "Lalk macOS voice workspace"
authors = ["Lalk"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
