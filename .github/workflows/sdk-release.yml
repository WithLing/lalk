name: Python SDK Release

# PyPI Trusted Publisher: workflow sdk-release.yml, environment pypi.

on:
  push:
    tags:
      - "sdk-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Python SDK distributions
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check release tag against package version
        if: github.event_name == 'push'
        run: python scripts/sdk/check_release_version.py "${{ github.ref_name }}"

      - name: Install SDK and build tooling
        run: python -m pip install -e ".[test]" build twine

      - name: Run SDK tests
        run: python -m pytest tests

      - name: Build wheel and source package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install generated wheel
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify SDK import
        run: python -c "import lalk; print(lalk.__file__)"

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Python SDK to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sdk-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/lalk
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
