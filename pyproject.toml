[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lalk"
version = "0.1.0"
description = "A real-time voice agent SDK built for natural conversation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "wxhcore" },
]
keywords = [
    "ai",
    "audio",
    "realtime",
    "speech",
    "voice-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "bumblehive>=0.3.0,<3",
    "numpy>=1.26.4,<3",
    "onnxruntime~=1.24.3",
    "sherpa-onnx==1.13.4",
    "sounddevice>=0.5.3,<0.6",
    "websockets>=15,<18",
]

[project.optional-dependencies]
build = [
    "pyinstaller==6.21.0",
]
server = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]
test = [
    "pyright>=1.1.400,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/WithLing/lalk"
Repository = "https://github.com/WithLing/lalk"
Issues = "https://github.com/WithLing/lalk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lalk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/lalk",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests", "server/tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/lalk/tts/_vendor/volcengine/protocols.py" = ["E501", "UP006", "UP035"]
